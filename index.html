<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sổ Tay ĐRL UMP (QĐ 1714) | Đại học Y Dược TP.HCM</title>

  <!-- PWA & Mobile Home Screen Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/icons/favicon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ĐRL UMP">
  <meta name="theme-color" content="#0B5ED7">
  
  <!-- Google Fonts: Be Vietnam Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ump: {
              50: '#F4F8FF',
              100: '#E0EDFE',
              500: '#0B5ED7',
              600: '#004A99',
              700: '#003670'
            }
          },
          fontFamily: {
            sans: ['"Be Vietnam Pro"', 'Inter', 'system-ui', 'sans-serif'],
            serif: ['"Times New Roman"', 'Times', 'serif']
          }
        }
      }
    }
  </script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/ump-drl.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- ==========================================
       1. HEADER SIÊU GỌN (1 HÀNG DUY NHẤT, CAO 56px)
       ========================================== -->
  <header id="app-header" class="no-print bg-white border-b border-slate-200 sticky top-0 z-40 h-14">
    <div class="max-w-[1620px] mx-auto px-2.5 sm:px-4 h-full flex items-center justify-between gap-2 sm:gap-3">
      
      <!-- Trái: Logo UMP + Tên hệ thống -->
      <div class="flex items-center gap-1.5 sm:gap-2.5 min-w-0">
        <img src="assets/icons/logo-web.png" alt="Logo Sổ Tay ĐRL UMP" class="w-8 h-8 object-contain shrink-0">
        <div class="flex items-center gap-2 min-w-0">
          <h1 class="font-bold text-slate-900 text-xs sm:text-base tracking-tight truncate">
            Sổ Tay ĐRL UMP <span class="hidden sm:inline text-[#0B5ED7]">(QĐ 1714)</span>
          </h1>
          <span id="save-indicator" class="hidden md:inline-flex items-center text-[11px] text-slate-400 font-normal ml-1">
            <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1"></span>Đã lưu
          </span>
        </div>
      </div>

      <!-- Phải: Chọn học kỳ, Xuất/In, Dropdown Thêm ▾ -->
      <div class="flex items-center gap-1 sm:gap-2 shrink-0">
        <select id="semester-select" aria-label="Chọn học kỳ"
          class="h-8 max-w-[96px] sm:max-w-none truncate text-xs font-semibold text-slate-700 bg-slate-50 border border-slate-300 rounded-lg px-1.5 sm:px-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none cursor-pointer">
        </select>

        <button id="btn-print-official" type="button" aria-label="Xuất / In Phiếu ĐRL" title="Xuất / In Phiếu ĐRL"
          class="h-8 inline-flex items-center justify-center gap-1.5 text-xs font-semibold px-2.5 sm:px-3 bg-[#0B5ED7] hover:bg-[#004A99] text-white rounded-lg shadow-xs transition-colors">
          <svg class="w-4 h-4 sm:w-3.5 sm:h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/>
          </svg>
          <span class="hidden sm:inline">Xuất / In Phiếu ĐRL</span>
        </button>

        <!-- Nút Chuông Bản tin ĐRL UMP (< 1280px mở Slide-over Drawer) -->
        <button id="btn-open-fb-drawer" type="button" onclick="window.fbFeed?.openDrawer()" aria-label="Bản tin ĐRL UMP" title="Bản tin ĐRL UMP"
          class="xl:hidden relative h-8 w-8 inline-flex items-center justify-center bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 rounded-lg transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
          </svg>
          <span id="fb-unread-badge" class="hidden absolute -top-1 -right-1 min-w-[16px] h-4 px-1 rounded-full bg-red-600 text-white text-[10px] font-bold flex items-center justify-center leading-none shadow-xs">0</span>
        </button>

        <!-- Dropdown Thêm ▾ -->
        <div id="more-menu-wrapper" class="relative">
          <button id="btn-more-menu" type="button"
            class="h-8 inline-flex items-center gap-1 text-xs font-semibold px-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 rounded-lg transition-colors">
            <span>Thêm</span>
            <span class="text-[10px]">▾</span>
          </button>

          <div id="more-menu-dropdown" class="hidden absolute right-0 mt-1.5 w-64 bg-white rounded-xl shadow-lg border border-slate-200 py-1 z-50 text-xs">
            <button id="btn-new-semester" type="button" class="w-full text-left px-3 py-2 hover:bg-slate-50 text-slate-700 font-medium flex items-center gap-2">
              <span class="text-blue-600 font-bold">+</span> Tạo học kỳ mới
            </button>
            <div class="border-t border-slate-100 my-1"></div>
            <button id="btn-export-csv" type="button" class="w-full text-left px-3 py-2 hover:bg-emerald-50 text-emerald-700 font-semibold flex items-center gap-2">
              <span>📊 Xuất file CSV (Excel / Chuyển máy)</span>
            </button>
            <button id="btn-import-csv" type="button" class="w-full text-left px-3 py-2 hover:bg-emerald-50 text-emerald-700 font-semibold flex items-center gap-2">
              <span>📥 Nhập dữ liệu từ file CSV</span>
            </button>
            <div class="border-t border-slate-100 my-1"></div>
            <button id="btn-export-json" type="button" class="w-full text-left px-3 py-2 hover:bg-slate-50 text-slate-700 font-medium flex items-center gap-2">
              <span class="text-slate-500">↓</span> Sao lưu JSON
            </button>
            <button id="btn-import-json" type="button" class="w-full text-left px-3 py-2 hover:bg-slate-50 text-slate-700 font-medium flex items-center gap-2">
              <span class="text-slate-500">↑</span> Khôi phục JSON
            </button>
            <div class="border-t border-slate-100 my-1"></div>
            <button id="btn-load-sample" type="button" class="w-full text-left px-3 py-2 hover:bg-blue-50 text-[#0B5ED7] font-semibold flex items-center gap-2">
              <span>★</span> Nạp mẫu Y Khoa
            </button>
          </div>
          <input type="file" id="file-import-input" accept=".json" class="hidden">
          <input type="file" id="file-import-csv-input" accept=".csv,text/csv" class="hidden">
        </div>
      </div>

    </div>
  </header>

  <!-- ==========================================
       2. THANH THÔNG TIN SINH VIÊN DẠNG DÒNG NGANG
       ========================================== -->
  <div id="student-bar" class="no-print bg-white border-b border-slate-200">
    <div class="max-w-[1620px] mx-auto px-4 py-2 flex flex-wrap items-center justify-between gap-2 text-xs">
      <div id="student-bar-summary" class="flex flex-wrap items-center gap-x-2 gap-y-1 text-slate-700">
        <!-- Render dynamically -->
      </div>
      <button id="btn-edit-student" type="button"
        class="inline-flex items-center gap-1 text-xs font-semibold text-[#0B5ED7] hover:text-[#004A99] hover:bg-[#F4F8FF] px-2.5 py-1 rounded-md border border-blue-200/80 transition-colors shrink-0">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
        </svg>
        <span>Sửa thông tin</span>
      </button>
    </div>
  </div>

  <!-- ==========================================
       3. BỐ CỤC 3 CỘT CÂN ĐỐI (MAX-W-1620PX)
       - >= 1280px (xl): Cột trái (300px) | Cột giữa (flex-1) | Cột phải Bản tin FB (330px)
       - < 1280px: Cột phải chuyển thành Slide-over Drawer mở từ nút Chuông 🔔
       ========================================== -->
  <main class="flex-1 max-w-[1620px] w-full mx-auto px-3 sm:px-4 py-3 sm:py-4 pb-24 lg:pb-4">
    <div class="flex flex-col lg:flex-row gap-3 lg:gap-4 xl:gap-5 items-start">

      <!-- THANH ĐIỂM + MỤC TIÊU STICKY CHỈ HIỂN THỊ TRÊN MOBILE/TABLET (< 1024px) -->
      <div id="mobile-score-sticky-bar" class="no-print lg:hidden order-1 sticky top-14 z-30 w-full bg-white/95 backdrop-blur-xs border border-slate-200 rounded-xl px-3 py-2 shadow-sm">
        <!-- Render dynamically -->
      </div>

      <!-- CỘT TRÁI (DESKTOP STICKY 300px | MOBILE DÙNG contents ĐỂ SẮP XẾP THỨ TỰ) -->
      <aside id="sidebar-col" class="no-print contents lg:block lg:w-[300px] shrink-0 lg:sticky lg:top-[70px] lg:space-y-3">

        <!-- Thẻ 1 (Desktop): Vòng tròn điểm tổng + Xếp loại + Nhắc mục tiêu -->
        <div id="score-summary-card" class="hidden lg:block bg-white rounded-xl border border-slate-200 p-3.5 shadow-2xs">
          <!-- Render dynamically -->
        </div>

        <!-- Thẻ 2: Ô tìm kiếm tiêu chí + 3 nút lọc ngang -->
        <div id="filter-card" class="order-3 lg:order-none w-full bg-white rounded-xl border border-slate-200 p-3 sm:p-3.5 shadow-2xs space-y-2.5">
          <div class="relative">
            <input type="text" id="criteria-search" placeholder="Tìm tiêu chí (hiến máu, văn nghệ cấp khoa, NCKH...)"
              class="w-full text-xs pl-8 pr-8 py-2 sm:py-1.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-slate-50">
            <svg class="w-4 h-4 sm:w-3.5 sm:h-3.5 text-slate-400 absolute left-2.5 top-2.5 sm:top-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <button type="button" id="criteria-search-clear" aria-label="Xóa từ khóa tìm kiếm"
              class="hidden absolute right-2 top-1/2 -translate-y-1/2 w-5 h-5 rounded-full text-slate-400 hover:text-slate-700 hover:bg-slate-200 flex items-center justify-center font-bold text-xs">
              ×
            </button>
          </div>

          <div class="grid grid-cols-3 gap-1.5 text-xs sm:text-[11px] font-semibold">
            <button type="button" data-filter="all"
              class="filter-pill py-1.5 px-1.5 rounded-lg text-center bg-[#0B5ED7] text-white transition-colors">
              Tất cả
            </button>
            <button type="button" data-filter="uncompleted"
              class="filter-pill py-1.5 px-1.5 rounded-lg text-center bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors">
              Chưa đạt
            </button>
            <button type="button" data-filter="easy"
              class="filter-pill py-1.5 px-1.5 rounded-lg text-center bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors">
              ⭐ Dễ kiếm
            </button>
          </div>
        </div>

        <!-- Thẻ 3: Hoạt động vừa ghi nhận (Đẩy xuống dưới #main-content-col trên Mobile) -->
        <div id="recent-activities-card" class="order-6 lg:order-none w-full bg-white rounded-xl border border-slate-200 p-3.5 shadow-2xs">
          <!-- Render dynamically -->
        </div>

      </aside>

      <!-- CỘT PHẢI (DESKTOP flex-1 | MOBILE DÙNG contents ĐỂ SẮP XẾP THỨ TỰ) -->
      <section id="right-main-col" class="contents lg:block lg:flex-1 lg:min-w-0 w-full lg:space-y-3">

        <!-- Thanh 5 Tab ngang + Tab Tất cả (Mobile: thanh cuộn ngang 1 dòng) -->
        <div id="part-tabs-bar" class="no-print order-2 lg:order-none w-full bg-white rounded-xl border border-slate-200 p-1.5 shadow-2xs flex flex-nowrap overflow-x-auto no-scrollbar lg:grid lg:grid-cols-6 gap-1.5 lg:gap-1">
          <!-- Render dynamically -->
        </div>

        <!-- Thanh công cụ nhỏ: Kỷ luật CTSV + Toggle Hiện cột Lớp/Khoa -->
        <div id="main-toolbar" class="no-print order-4 lg:order-none w-full bg-white rounded-xl border border-slate-200 px-3.5 py-2 flex flex-wrap items-center justify-between gap-2 text-xs shadow-2xs">
          <div class="flex items-center gap-2.5 flex-wrap">
            <span id="active-tab-subtitle" class="font-semibold text-slate-700"></span>
            <button id="btn-open-disciplinary" type="button"
              class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md border text-[11px] font-semibold transition-colors">
              <!-- Render dynamically -->
            </button>
          </div>

          <label class="inline-flex items-center gap-2 cursor-pointer select-none min-h-[36px] md:min-h-0">
            <span class="text-xs font-medium text-slate-600">Hiện cột đối chiếu Lớp / Khoa</span>
            <span class="relative inline-block w-9 h-5 shrink-0">
              <input type="checkbox" id="toggle-compare-cols" class="sr-only peer">
              <span class="block w-9 h-5 bg-slate-200 rounded-full peer-checked:bg-[#0B5ED7] transition-colors"></span>
              <span class="absolute left-0.5 top-0.5 w-4 h-4 bg-white rounded-full shadow-xs transition-transform peer-checked:translate-x-4"></span>
            </span>
          </label>
        </div>

        <!-- Bảng tiêu chí rút gọn (Mobile: Stacked Cards) -->
        <div id="main-content-col" class="order-5 lg:order-none w-full space-y-3">
          <!-- Render dynamically -->
        </div>

      </section>

      <!-- BACKDROP CHO SLIDE-OVER DRAWER (< 1280px) -->
      <div id="fb-drawer-backdrop" onclick="window.fbFeed?.closeDrawer()"
        class="no-print hidden xl:hidden fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-40"></div>

      <!-- CỘT PHẢI MỚI (330px STICKY TRÊN XL | SLIDE-OVER DRAWER TRÊN < 1280px) -->
      <aside id="fb-feed-column"
        class="no-print fixed inset-y-0 right-0 z-50 w-[340px] max-w-[92vw] bg-white shadow-2xl transform transition-transform duration-300 translate-x-full xl:translate-x-0 xl:static xl:w-[330px] xl:shrink-0 xl:sticky xl:top-[70px] xl:shadow-none xl:bg-transparent xl:z-auto">
        <!-- Render dynamically via UmpFbFeed -->
      </aside>

    </div>
  </main>

  <!-- NÚT NỔI (FAB) CHỈ HIỂN THỊ TRÊN MOBILE/TABLET (< 1024px) -->
  <button id="mobile-fab-add" type="button" onclick="window.app.openQuickAddModal()"
    class="no-print lg:hidden fixed bottom-5 right-4 z-40 inline-flex items-center gap-1.5 min-h-[48px] px-4 bg-[#0B5ED7] hover:bg-[#004A99] active:scale-95 text-white text-sm font-bold rounded-full shadow-lg transition-transform">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
    </svg>
    <span>Ghi nhận HĐ</span>
  </button>

  <!-- ==========================================
       CONTAINER IN CHUẨN MẪU HÀNH CHÍNH (@media print)
       ========================================== -->
  <div id="official-print-sheet" class="hidden"></div>

  <!-- ==========================================
       MODAL SỬA THÔNG TIN SINH VIÊN
       ========================================== -->
  <div id="edit-student-modal" class="hidden fixed inset-0 z-50 overflow-y-auto no-print">
    <div class="fixed inset-0 bg-slate-900/45 backdrop-blur-xs" onclick="window.app.closeEditStudentModal()"></div>
    <div class="relative min-h-screen flex items-end md:items-center justify-center p-0 md:p-4">
      <div class="relative bg-white rounded-t-2xl md:rounded-2xl max-w-md w-full p-5 shadow-2xl border border-slate-200 max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between pb-3 border-b border-slate-200 mb-4">
          <h3 class="font-bold text-slate-800 text-sm">Thông Tin Sinh Viên (UMP)</h3>
          <button type="button" onclick="window.app.closeEditStudentModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>

        <div class="space-y-3 text-xs">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Họ và tên sinh viên</label>
            <input type="text" id="modal-student-name" placeholder="VD: Nguyễn Văn Minh"
              class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block font-semibold text-slate-700 mb-1">MSSV</label>
              <input type="text" id="modal-student-id" placeholder="VD: 2651010099"
                class="w-full px-3 py-2 border border-slate-300 rounded-lg font-mono focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Lớp</label>
              <input type="text" id="modal-student-class" placeholder="VD: YK2026A"
                class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block font-semibold text-slate-700 mb-1">Khóa học</label>
              <input type="text" id="modal-student-course" placeholder="VD: Khóa 2026 - 2032"
                class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
              <label class="block font-semibold text-slate-700 mb-1">ĐTB Học kỳ (thang 10)</label>
              <input type="number" step="0.01" min="0" max="10" id="modal-student-gpa" placeholder="VD: 7.80"
                class="w-full px-3 py-2 border border-slate-300 rounded-lg font-bold focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
          </div>
          <p class="text-[11px] text-slate-500 bg-blue-50/70 p-2 rounded-lg border border-blue-100">
            💡 Điểm TB học kỳ ≥ 6.5 tự động nâng điểm cán bộ lớp Nhóm B từ 6đ lên 8đ, Nhóm C từ 4đ lên 6đ.
          </p>
        </div>

        <div class="flex justify-end gap-2 mt-5 pt-3 border-t border-slate-200">
          <button type="button" onclick="window.app.closeEditStudentModal()" class="px-3.5 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-lg">Hủy</button>
          <button type="button" onclick="window.app.saveStudentModal()" class="px-4 py-1.5 text-xs font-bold bg-[#0B5ED7] hover:bg-[#004A99] text-white rounded-lg">Lưu thông tin</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ==========================================
       MODAL KỶ LUẬT CTSV TOÀN PHIẾU
       ========================================== -->
  <div id="disciplinary-modal" class="hidden fixed inset-0 z-50 overflow-y-auto no-print">
    <div class="fixed inset-0 bg-slate-900/45 backdrop-blur-xs" onclick="window.app.closeDisciplinaryModal()"></div>
    <div class="relative min-h-screen flex items-end md:items-center justify-center p-0 md:p-4">
      <div class="relative bg-white rounded-t-2xl md:rounded-2xl max-w-lg w-full p-5 shadow-2xl border border-slate-200 max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between pb-3 border-b border-slate-200 mb-4">
          <h3 class="font-bold text-slate-800 text-sm">Điểm Trừ Vi Phạm Quy Chế CTSV Khác</h3>
          <button type="button" onclick="window.app.closeDisciplinaryModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <div id="disciplinary-modal-body" class="space-y-3">
          <!-- Render dynamically -->
        </div>
        <div class="flex justify-end mt-5 pt-3 border-t border-slate-200">
          <button type="button" onclick="window.app.closeDisciplinaryModal()" class="px-4 py-1.5 text-xs font-bold bg-slate-800 hover:bg-slate-900 text-white rounded-lg">Đóng</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ==========================================
       MODAL TẠO HỌC KỲ MỚI
       ========================================== -->
  <div id="new-semester-modal" class="hidden fixed inset-0 z-50 overflow-y-auto no-print">
    <div class="fixed inset-0 bg-slate-900/45 backdrop-blur-xs" onclick="window.app.closeNewSemesterModal()"></div>
    <div class="relative min-h-screen flex items-end md:items-center justify-center p-0 md:p-4">
      <div class="relative bg-white rounded-t-2xl md:rounded-2xl max-w-md w-full p-5 shadow-2xl border border-slate-200 max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between pb-3 border-b border-slate-200 mb-4">
          <h3 class="font-bold text-slate-800 text-sm">Tạo Học Kỳ Rèn Luyện Mới</h3>
          <button type="button" onclick="window.app.closeNewSemesterModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>

        <div class="space-y-3 text-xs">
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Năm học</label>
            <input type="text" id="new-sem-year" value="2026–2027" placeholder="VD: 2026–2027"
              class="w-full px-3 py-2 border border-slate-300 rounded-lg font-semibold focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>
          <div>
            <label class="block font-semibold text-slate-700 mb-1">Học kỳ</label>
            <select id="new-sem-term" class="w-full px-3 py-2 border border-slate-300 rounded-lg font-semibold bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
              <option value="HK1">Học kỳ 1 (HK1)</option>
              <option value="HK2">Học kỳ 2 (HK2)</option>
              <option value="HK Hè">Học kỳ hè</option>
            </select>
          </div>
          <label class="flex items-center gap-2 p-2.5 bg-slate-50 rounded-lg border border-slate-200 cursor-pointer">
            <input type="checkbox" id="new-sem-keep-student" checked class="w-4 h-4 text-blue-600 rounded">
            <span class="font-medium text-slate-700">Giữ nguyên thông tin sinh viên hiện tại</span>
          </label>
        </div>

        <div class="flex justify-end gap-2 mt-5 pt-3 border-t border-slate-200">
          <button type="button" onclick="window.app.closeNewSemesterModal()" class="px-3.5 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-lg">Hủy</button>
          <button type="button" onclick="window.app.confirmCreateSemester()" class="px-4 py-1.5 text-xs font-bold bg-[#0B5ED7] hover:bg-[#004A99] text-white rounded-lg">Tạo và Kích hoạt</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ==========================================
       MODAL THÊM NHANH HOẠT ĐỘNG TỪ SIDEBAR
       ========================================== -->
  <div id="quick-add-activity-modal" class="hidden fixed inset-0 z-50 overflow-y-auto no-print">
    <div class="fixed inset-0 bg-slate-900/45 backdrop-blur-xs" onclick="window.app.closeQuickAddModal()"></div>
    <div class="relative min-h-screen flex items-end md:items-center justify-center p-0 md:p-4">
      <div class="relative bg-white rounded-t-2xl md:rounded-2xl max-w-lg w-full p-5 shadow-2xl border border-slate-200 max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between pb-3 border-b border-slate-200 mb-4">
          <h3 class="font-bold text-slate-800 text-sm">Ghi Nhận Nhanh Hoạt Động Rèn Luyện</h3>
          <button type="button" onclick="window.app.closeQuickAddModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>

        <form id="quick-add-form" onsubmit="event.preventDefault(); window.app.submitQuickAddActivity();" class="space-y-3 text-xs">
          <div id="quick-act-combobox" class="relative">
            <label for="quick-act-criterion-search" class="block font-semibold text-slate-700 mb-1">Chọn tiêu chí tính điểm <span class="text-red-500">*</span></label>
            <input type="hidden" id="quick-act-criterion" value="">

            <!-- Hiển thị tiêu chí đang chọn -->
            <div id="quick-act-selected-label" class="mb-1.5 px-2.5 py-1.5 rounded-lg bg-[#F4F8FF] border border-blue-200 text-[11px] font-semibold text-[#004A99] flex items-center justify-between gap-2">
              <span class="truncate">Chưa chọn tiêu chí</span>
            </div>

            <!-- Ô tìm kiếm Combobox -->
            <div class="relative">
              <input type="text" id="quick-act-criterion-search" autocomplete="off"
                placeholder="Gõ tên mục hoặc nội dung HĐ (VD: văn nghệ cấp khoa, hiến máu, NCKH...)"
                class="w-full pl-8 pr-8 py-2 border border-slate-300 rounded-lg bg-white text-slate-800 focus:ring-2 focus:ring-blue-500 focus:outline-none">
              <svg class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
              </svg>
              <button type="button" id="quick-act-criterion-clear" aria-label="Xóa tìm kiếm tiêu chí"
                class="hidden absolute right-2 top-1/2 -translate-y-1/2 w-5 h-5 rounded-full text-slate-400 hover:text-slate-700 hover:bg-slate-200 flex items-center justify-center font-bold text-xs">
                ×
              </button>
            </div>

            <!-- Danh sách thả xuống -->
            <div id="quick-act-criterion-list"
              class="hidden mt-1 max-h-56 overflow-y-auto bg-white border border-slate-300 rounded-xl shadow-lg divide-y divide-slate-100">
              <!-- Render dynamically -->
            </div>
          </div>

          <div>
            <label for="quick-act-title" class="block font-semibold text-slate-700 mb-1">Tên hoạt động / Sự kiện <span class="text-red-500">*</span></label>
            <input type="text" id="quick-act-title" required placeholder="VD: Hiến máu nhân đạo Giọt Hồng Blouse Trắng..."
              class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label for="quick-act-date" class="block font-semibold text-slate-700 mb-1">Ngày tham gia</label>
              <input type="date" id="quick-act-date"
                class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
              <label for="quick-act-proof" class="block font-semibold text-slate-700 mb-1">Ghi chú / Link minh chứng</label>
              <input type="text" id="quick-act-proof" placeholder="Số GCN hoặc link ảnh..."
                class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
          </div>

          <div class="flex justify-end gap-2 mt-5 pt-3 border-t border-slate-200">
            <button type="button" onclick="window.app.closeQuickAddModal()" class="px-3.5 py-1.5 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-lg">Hủy</button>
            <button type="submit" class="px-4 py-1.5 text-xs font-bold bg-[#0B5ED7] hover:bg-[#004A99] text-white rounded-lg shadow-xs">Lưu hoạt động</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Scripts (Giữ nguyên data, engine, storage) -->
  <script src="js/ump-drl-data.js"></script>
  <script src="js/ump-drl-engine.js"></script>
  <script src="js/ump-drl-storage.js"></script>
  <script src="js/ump-drl-app.js"></script>
  <script src="js/ump-fb-feed.js"></script>
</body>
</html>
